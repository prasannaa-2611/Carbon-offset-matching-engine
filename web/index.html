<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carbon Offset Matching Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        header {
            background: #14532d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            margin-top: 0;
            color: #14532d;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .results {
            margin-top: 30px;
        }

        .results h2 {
            color: #14532d;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 5px solid #16a34a;
        }

        .project-card h3 {
            margin-top: 0;
            color: #14532d;
        }

        .project-type {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .info {
            margin: 9px 0;
        }

        .score {
            margin-top: 15px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            font-weight: bold;
            color: #166534;
            text-align: center;
        }

        .no-results {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 750px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌱 Carbon Offset Matching Engine</h1>
    <p>Find suitable carbon projects based on your requirements</p>
</header>

<div class="container">

    <!-- SEARCH FORM -->

    <div class="form-card">

        <h2>Find Carbon Projects</h2>

        <form id="matchForm">

            <div class="form-grid">

                <div class="field">
                    <label for="credits">
                        Required Credits
                    </label>

                    <input
                        type="number"
                        id="credits"
                        name="credits"
                        placeholder="Example: 500"
                        required
                        min="1"
                    >
                </div>

                <div class="field">
                    <label for="price">
                        Maximum Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="Example: 500"
                        required
                        min="0"
                        step="0.01"
                    >
                </div>

                <div class="field">
                    <label for="type">
                        Project Type
                    </label>

                    <select
                        id="type"
                        name="type"
                        required
                    >
                        <option value="Renewable Energy">
                            Renewable Energy
                        </option>

                        <option value="Forestry">
                            Forestry
                        </option>

                        <option value="Afforestation">
                            Afforestation
                        </option>

                        <option value="Waste Management">
                            Waste Management
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="location">
                        Location
                    </label>

                    <select
                        id="location"
                        name="location"
                        required
                    >
                        <option value="India">
                            India
                        </option>

                        <option value="Brazil">
                            Brazil
                        </option>

                        <option value="USA">
                            USA
                        </option>

                        <option value="Africa">
                            Africa
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="sort">
                        Sort Results
                    </label>

                    <select
                        id="sort"
                        name="sort"
                    >
                        <option value="score">
                            Best Match Score
                        </option>

                        <option value="price">
                            Lowest Price
                        </option>

                        <option value="credits">
                            Highest Credits
                        </option>
                    </select>
                </div>

            </div>

            <button type="submit">
                🔍 Find Matching Projects
            </button>

        </form>

        <div id="status"></div>

    </div>


    <!-- RESULTS -->

    <div class="results">

        <h2 id="resultsTitle" style="display:none;">
            Matching Projects
        </h2>

        <div
            id="results"
            class="results-grid"
        ></div>

    </div>

</div>


<script>

const form = document.getElementById("matchForm");

const results = document.getElementById("results");

const resultsTitle =
    document.getElementById("resultsTitle");

const status =
    document.getElementById("status");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    results.innerHTML = "";

    resultsTitle.style.display = "none";

    status.textContent =
        "Searching for matching projects...";


    const formData =
        new URLSearchParams();

    formData.append(
        "credits",
        document.getElementById("credits").value
    );

    formData.append(
        "price",
        document.getElementById("price").value
    );

    formData.append(
        "type",
        document.getElementById("type").value
    );

    formData.append(
        "location",
        document.getElementById("location").value
    );

    formData.append(
        "sort",
        document.getElementById("sort").value
    );


    try {

        const response =
            await fetch("/api/match", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: formData.toString()
            });


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        status.textContent = "";


        if (
            !data.matches ||
            data.matches.length === 0
        ) {

            resultsTitle.style.display = "block";

            results.innerHTML = `
                <div class="no-results">
                    <h3>No matching projects found</h3>
                    <p>
                        Try changing the credits,
                        price, project type,
                        or location.
                    </p>
                </div>
            `;

            return;
        }


        resultsTitle.style.display = "block";


        data.matches.forEach(function(match) {

            const card =
                document.createElement("div");

            card.className =
                "project-card";


            card.innerHTML = `

                <h3>
                    🌱 ${escapeHtml(match.projectName)}
                </h3>

                <span class="project-type">
                    ${escapeHtml(match.projectType)}
                </span>

                <div class="info">
                    📍 <strong>Location:</strong>
                    ${escapeHtml(match.location)}
                </div>

                <div class="info">
                    🌿 <strong>Credits:</strong>
                    ${match.credits}
                </div>

                <div class="info">
                    💰 <strong>Price:</strong>
                    ₹${Number(match.price).toFixed(2)}
                </div>

                <div class="info">
                    📊 <strong>Type Score:</strong>
                    ${match.typeScore}
                </div>

                <div class="info">
                    📍 <strong>Location Score:</strong>
                    ${match.locationScore}
                </div>

                <div class="info">
                    💵 <strong>Price Score:</strong>
                    ${match.priceScore}
                </div>

                <div class="info">
                    🌿 <strong>Availability Score:</strong>
                    ${match.availabilityScore}
                </div>

                <div class="score">
                    ⭐ Match Score:
                    ${match.score}
                </div>
            `;


            results.appendChild(card);

        });

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Could not connect to the Java server.";

        results.innerHTML = "";

    }

});


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
